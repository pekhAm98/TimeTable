services:
  oracle-db:
    image: container-registry.oracle.com/database/free:latest
    container_name: metro-oracle
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      ORACLE_PWD: YourPassword123
    volumes:
      - oracle-data:/opt/oracle/oradata
    restart: unless-stopped

volumes:
  oracle-data: